[workspace]
resolver = "2"
members = ["crates/netmeter-core", "crates/netmeter"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
authors = ["Omer Dikyol"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/omerdikyol/netmeter"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
directories = "5"
clap = { version = "4", features = ["derive"] }
sysinfo = "0.33"
rusqlite = { version = "0.32", features = ["bundled"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
