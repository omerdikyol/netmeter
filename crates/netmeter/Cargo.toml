[package]
name = "netmeter"
description = "Lightweight cross-platform network usage monitor for the menu bar / system tray"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../README.md"
keywords = ["network", "bandwidth", "tray", "menubar", "monitor"]
categories = ["command-line-utilities"]

[[bin]]
name = "netmeter"
path = "src/main.rs"

[dependencies]
netmeter-core = { path = "../netmeter-core" }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
clap.workspace = true
chrono.workspace = true
tray-icon = "0.24.2"
tao = { version = "0.36.0", features = ["rwh_06"] }
fontdue = "0.9.4"
wry = "0.56.1"
window-vibrancy = "0.8.1"
