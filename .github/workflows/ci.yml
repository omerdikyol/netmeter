name: CI

# macOS only, for now: the panel renders in the system webview through `wry`,
# which needs a GTK loop initialised on Linux that this app does not set up yet,
# and Windows has never been exercised at all. Claiming those platforms in CI
# without integrating them would just be a green badge that means nothing.
# `crates/netmeter-core` itself is portable.

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --all --all-features

      # Building the bundle catches packaging mistakes that the library tests do not.
      - name: Build and assemble the app
        run: |
          cargo build --release
          packaging/macos/bundle.sh
