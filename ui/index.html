<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>NetMeter</title>
<style>
  :root {
    --rx: #4da3ff;
    --tx: #ff9f0a;
    --fg: #f2f2f7;
    --fg-dim: rgba(235, 235, 245, 0.55);
    --fg-faint: rgba(235, 235, 245, 0.32);
    --line: rgba(255, 255, 255, 0.08);
    --card: rgba(255, 255, 255, 0.05);
    --card-hi: rgba(255, 255, 255, 0.1);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    background: transparent;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    font-size: 13px;
    color: var(--fg);
    -webkit-font-smoothing: antialiased;
    user-select: none;
    cursor: default;
  }

  #app {
    position: relative;
    display: flex;
    flex-direction: column;
    height: 100%;
    padding: 12px 14px 10px;
    gap: 8px;
    background: rgba(28, 28, 31, 0.55);
    border: 1px solid var(--line);
    border-radius: 14px;
  }

  /* ---------- header ---------- */
  header { display: flex; align-items: flex-end; justify-content: space-between; }
  .brand {
    font-size: 10px; font-weight: 600; letter-spacing: 0.09em;
    text-transform: uppercase; color: var(--fg-faint); padding-bottom: 3px;
  }
  .live { display: flex; gap: 16px; }
  .live-item { display: flex; align-items: baseline; gap: 4px; }
  .live-item .num {
    font-size: 17px; font-weight: 600; letter-spacing: -0.02em;
    font-variant-numeric: tabular-nums;
  }
  .live-item .unit { font-size: 10px; font-weight: 500; color: var(--fg-dim); }
  .live-item.down .arw { color: var(--rx); font-size: 12px; }
  .live-item.up .arw { color: var(--tx); font-size: 12px; }

  /* ---------- range button ---------- */
  .rangebar { display: flex; align-items: center; gap: 6px; }
  #range-reset {
    display: none; appearance: none; border: 0; background: transparent;
    color: var(--rx); font: inherit; font-size: 10.5px; font-weight: 600;
    padding: 3px 6px; border-radius: 6px; cursor: default;
  }
  #range-reset.show { display: block; }
  #range-reset:hover { background: var(--card); }
  #range-btn {
    display: flex; align-items: center; gap: 5px;
    appearance: none; border: 0; background: var(--card); color: var(--fg);
    font: inherit; font-size: 11.5px; font-weight: 500;
    padding: 5px 9px; border-radius: 7px; cursor: default;
    max-width: 210px;
  }
  #range-btn:hover { background: var(--card-hi); }
  #range-btn .label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #range-btn .chev { color: var(--fg-faint); font-size: 9px; }
  #range-btn.open { background: var(--card-hi); }
  .range-total {
    margin-left: auto;
    font-size: 11px; color: var(--fg-dim); font-variant-numeric: tabular-nums;
  }

  /* ---------- range sheet ---------- */
  .sheet {
    position: absolute; left: 10px; right: 10px; top: 72px;
    display: none; flex-direction: column; gap: 8px;
    padding: 10px; z-index: 6;
    background: rgba(22, 22, 25, 0.97);
    border: 1px solid rgba(255, 255, 255, 0.11);
    border-radius: 11px;
    box-shadow: 0 14px 34px rgba(0, 0, 0, 0.5);
  }
  .sheet.open { display: flex; }
  .sheet-title {
    font-size: 9.5px; font-weight: 600; letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--fg-faint);
  }
  .chips { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
  .chip {
    appearance: none; border: 0; background: var(--card); color: var(--fg-dim);
    font: inherit; font-size: 11px; font-weight: 500;
    padding: 6px 0; border-radius: 6px; cursor: default;
  }
  .chip:hover { color: var(--fg); background: var(--card-hi); }
  .chip.on { background: var(--rx); color: #06121f; font-weight: 600; }
  .sheet hr { border: 0; border-top: 1px solid var(--line); }
  .field { display: flex; align-items: center; gap: 6px; }
  .field > span {
    width: 32px; font-size: 10px; color: var(--fg-dim); flex: none;
  }
  .field input {
    appearance: none; border: 0; background: rgba(0, 0, 0, 0.3);
    color: var(--fg); font: inherit; font-size: 11px;
    padding: 5px 6px; border-radius: 6px; min-width: 0;
    font-variant-numeric: tabular-nums;
  }
  .field input[type="date"] { flex: 1; }
  .field input[type="time"] { width: 82px; flex: none; }
  .field input:focus { outline: 1px solid var(--rx); outline-offset: -1px; }
  .field input::-webkit-calendar-picker-indicator { filter: invert(1); opacity: 0.45; }
  #apply {
    appearance: none; border: 0; border-radius: 7px;
    background: var(--rx); color: #06121f;
    font: inherit; font-size: 11.5px; font-weight: 600;
    padding: 7px 0; cursor: default;
  }
  #apply:hover { filter: brightness(1.08); }
  .sheet-msg {
    font-size: 10px; color: var(--fg-faint); text-align: center; min-height: 13px;
  }
  .sheet-msg.bad { color: #ff6f66; }

  /* ---------- chart ---------- */
  .chart { position: relative; height: 108px; }
  .chart svg { display: block; width: 100%; height: 108px; overflow: visible; }
  .axis-x {
    display: flex; justify-content: space-between; font-size: 10px;
    color: var(--fg-faint); font-variant-numeric: tabular-nums;
  }
  .peak {
    position: absolute; top: -1px; right: 0; font-size: 10px;
    color: var(--fg-faint); font-variant-numeric: tabular-nums;
  }
  .empty {
    position: absolute; inset: 0; display: none; align-items: center;
    justify-content: center; font-size: 11px; color: var(--fg-faint);
  }
  #sel {
    position: absolute; top: 0; height: 108px; display: none;
    background: rgba(77, 163, 255, 0.18);
    border-left: 1px solid var(--rx); border-right: 1px solid var(--rx);
  }
  #tip {
    position: absolute; display: none; pointer-events: none; padding: 5px 7px;
    background: rgba(20, 20, 22, 0.94); border: 1px solid var(--line);
    border-radius: 7px; font-size: 10.5px; line-height: 1.5;
    font-variant-numeric: tabular-nums; white-space: nowrap;
    box-shadow: 0 6px 18px rgba(0, 0, 0, 0.4);
  }
  #tip b { font-weight: 600; }

  /* ---------- totals ---------- */
  .cards { display: flex; gap: 8px; }
  .card { flex: 1; background: var(--card); border-radius: 9px; padding: 6px 9px; }
  .card-label { font-size: 10px; color: var(--fg-dim); margin-bottom: 1px; }
  .card-value {
    font-size: 15px; font-weight: 600; letter-spacing: -0.01em;
    font-variant-numeric: tabular-nums;
  }

  /* ---------- cap ---------- */
  .cap { display: none; flex-direction: column; gap: 4px; }
  .cap-head {
    display: flex; justify-content: space-between;
    font-size: 10.5px; font-variant-numeric: tabular-nums;
  }
  .cap-head .used { color: var(--fg-dim); }
  .cap-head .pct { font-weight: 600; }
  .cap-bar { height: 5px; border-radius: 3px; background: var(--card-hi); overflow: hidden; }
  .cap-bar > div {
    height: 100%; border-radius: 3px;
    background: linear-gradient(90deg, var(--rx), #7bb8ff);
    transition: width 0.3s ease;
  }
  .cap.warn .cap-bar > div { background: linear-gradient(90deg, var(--tx), #ffbf5c); }
  .cap.over .cap-bar > div { background: linear-gradient(90deg, #ff453a, #ff6f66); }
  .cap.warn .cap-head .pct { color: var(--tx); }
  .cap.over .cap-head .pct { color: #ff6f66; }
  .cap-foot { font-size: 10px; color: var(--fg-faint); }

  /* ---------- rows ---------- */
  .section-head { display: flex; align-items: center; justify-content: space-between; }
  .section-title {
    font-size: 10px; letter-spacing: 0.09em; text-transform: uppercase;
    color: var(--fg-faint); font-weight: 600;
  }
  .hint { font-size: 10px; color: var(--fg-faint); }
  .seg { display: flex; gap: 2px; }
  .seg button {
    appearance: none; border: 0; background: transparent; color: var(--fg-faint);
    font: inherit; font-size: 10px; font-weight: 500; padding: 2px 7px;
    border-radius: 5px; cursor: default;
  }
  .seg button:hover { color: var(--fg-dim); }
  .seg button.on { background: var(--card-hi); color: var(--fg); }

  .rows { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 2px; }
  .rows::-webkit-scrollbar { width: 0; }
  .row {
    display: grid; grid-template-columns: 1fr auto auto; gap: 8px;
    align-items: baseline; padding: 3px 6px; border-radius: 6px;
    font-variant-numeric: tabular-nums;
  }
  .row:hover { background: var(--card); }
  .row .name { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .rate { font-size: 10.5px; color: var(--fg-dim); }
  .row .total { font-size: 11.5px; color: var(--fg-dim); }
  .none { font-size: 11px; color: var(--fg-faint); padding: 4px 6px; line-height: 1.45; }

  /* ---------- footer ---------- */
  footer {
    display: flex; justify-content: space-between; align-items: center;
    border-top: 1px solid var(--line); padding-top: 7px;
    font-size: 10.5px; color: var(--fg-faint);
    font-variant-numeric: tabular-nums;
  }
  footer button {
    appearance: none; border: 0; background: transparent; color: var(--fg-dim);
    font: inherit; font-size: 10.5px; cursor: default; padding: 0;
  }
  footer button:hover { color: var(--fg); }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand">NetMeter</div>
    <div class="live">
      <div class="live-item down"><span class="arw">&#8595;</span><span class="num" id="rate-rx">0</span><span class="unit" id="unit-rx">B/s</span></div>
      <div class="live-item up"><span class="arw">&#8593;</span><span class="num" id="rate-tx">0</span><span class="unit" id="unit-tx">B/s</span></div>
    </div>
  </header>

  <div class="rangebar">
    <button id="range-btn"><span class="label" id="range-label">Today</span><span class="chev">&#9662;</span></button>
    <button id="range-reset">Reset</button>
    <span class="range-total" id="range-total"></span>
  </div>

  <div class="sheet" id="sheet">
    <div class="sheet-title">Quick ranges</div>
    <div class="chips" id="chips"></div>
    <hr>
    <div class="sheet-title">Custom range</div>
    <div class="field">
      <span>From</span>
      <input type="date" id="from-date">
      <input type="time" id="from-time" value="00:00">
    </div>
    <div class="field">
      <span>To</span>
      <input type="date" id="to-date">
      <input type="time" id="to-time" value="23:59">
    </div>
    <button id="apply">Apply range</button>
    <div class="sheet-msg" id="sheet-msg">Tip: you can drag across the chart to zoom.</div>
  </div>

  <section class="chart" id="chart">
    <svg id="graph" viewBox="0 0 300 108" preserveAspectRatio="none"></svg>
    <div id="sel"></div>
    <div id="empty" class="empty">Collecting data&hellip;</div>
    <div id="tip"></div>
    <div class="peak" id="peak"></div>
    <div class="axis-x"><span id="x-from"></span><span id="x-to"></span></div>
  </section>

  <section class="cards">
    <div class="card"><div class="card-label">Today</div><div class="card-value" id="today">&mdash;</div></div>
    <div class="card"><div class="card-label" id="cycle-label">This cycle</div><div class="card-value" id="cycle">&mdash;</div></div>
  </section>

  <section class="cap" id="cap">
    <div class="cap-head"><span class="used" id="cap-used"></span><span class="pct" id="cap-pct"></span></div>
    <div class="cap-bar"><div id="cap-fill" style="width:0%"></div></div>
    <div class="cap-foot" id="cap-foot"></div>
  </section>

  <div class="section-head">
    <div class="section-title">Usage by</div>
    <div class="seg" id="modes">
      <button data-mode="apps" class="on">Apps</button>
      <button data-mode="ifaces">Interfaces</button>
    </div>
  </div>
  <div class="hint" id="hint"></div>
  <div class="rows" id="rows"></div>

  <footer>
    <span id="note">Drag the chart to zoom</span>
    <button id="quit">Quit</button>
  </footer>
</div>

<script>
(function () {
  "use strict";

  var UNITS = ["B", "KB", "MB", "GB", "TB", "PB"];
  var CHIPS = [
    { key: "1h", label: "1H" }, { key: "6h", label: "6H" },
    { key: "12h", label: "12H" }, { key: "24h", label: "24H" },
    { key: "7d", label: "7D" }, { key: "30d", label: "30D" },
    { key: "today", label: "Today" }, { key: "cycle", label: "Cycle" }
  ];
  var W = 300, H = 108, PADT = 10, PADB = 4;

  var state = null;
  var mode = "apps";
  var lastPreset = "today";
  var el = function (id) { return document.getElementById(id); };
  var post = function (msg) { window.ipc.postMessage(JSON.stringify(msg)); };
  var sheetOpen = false;

  /* ---------- formatting ---------- */
  function split(value) {
    var i = 0; value = Math.max(0, value);
    while (value >= 1000 && i < UNITS.length - 1) { value /= 1000; i++; }
    return [value, i];
  }
  function bytes(v) {
    var p = split(v), n = p[1] === 0 ? String(Math.round(p[0])) : p[0].toFixed(p[0] < 10 ? 2 : 1);
    return n + " " + UNITS[p[1]];
  }
  function rateParts(v) {
    var p = split(v), n = p[1] === 0 ? String(Math.round(p[0])) : p[0].toFixed(p[0] < 10 ? 2 : 1);
    return [n, UNITS[p[1]] + "/s"];
  }
  function rateShort(v) {
    var p = split(v), n = p[1] === 0 ? String(Math.round(p[0])) : p[0].toFixed(p[0] < 10 ? 1 : 0);
    return n + UNITS[p[1]];
  }
  function clockTime(ts) { return new Date(ts * 1000).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }); }
  function stamp(ts) {
    return new Date(ts * 1000).toLocaleString([], {
      month: "short", day: "numeric", hour: "2-digit", minute: "2-digit"
    });
  }
  function axisLabel(ts, spanSecs) {
    return spanSecs > 3 * 86400
      ? new Date(ts * 1000).toLocaleDateString([], { month: "short", day: "numeric" })
      : clockTime(ts);
  }
  function ordinal(n) {
    var s = ["th", "st", "nd", "rd"], v = n % 100;
    return n + (s[(v - 20) % 10] || s[v] || s[0]);
  }

  /* One line describing the active window. */
  function describe(s) {
    if (s.range !== "custom" || !s.custom) { return s.rangeLabel; }
    var a = new Date(s.custom[0] * 1000), b = new Date(s.custom[1] * 1000);
    var day = function (d) { return d.toLocaleDateString([], { month: "short", day: "numeric" }); };
    var time = function (d) { return d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }); };
    return a.toDateString() === b.toDateString()
      ? day(a) + " " + time(a) + "\u2013" + time(b)
      : day(a) + " \u2192 " + day(b);
  }

  /* ---------- chips ---------- */
  var chips = el("chips");
  CHIPS.forEach(function (c) {
    var b = document.createElement("button");
    b.className = "chip";
    b.textContent = c.label;
    b.dataset.key = c.key;
    b.addEventListener("click", function () { post({ type: "range", value: c.key }); });
    chips.appendChild(b);
  });

  /* ---------- sheet ---------- */
  function dateValue(ts) {
    var d = new Date(ts * 1000), p = function (n) { return String(n).padStart(2, "0"); };
    return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate());
  }
  function timeValue(ts) {
    var d = new Date(ts * 1000), p = function (n) { return String(n).padStart(2, "0"); };
    return p(d.getHours()) + ":" + p(d.getMinutes());
  }
  function fillInputs(from, to) {
    el("from-date").value = dateValue(from);
    el("from-time").value = timeValue(from);
    el("to-date").value = dateValue(to);
    el("to-time").value = timeValue(to);
  }
  function epochOf(dateId, timeId) {
    var d = el(dateId).value;
    if (!d) { return 0; }
    var ms = new Date(d + "T" + (el(timeId).value || "00:00")).getTime();
    return isNaN(ms) ? 0 : Math.floor(ms / 1000);
  }
  function setSheet(open) {
    sheetOpen = open;
    el("sheet").classList.toggle("open", open);
    el("range-btn").classList.toggle("open", open);
    if (open && state) {
      var w = state.custom || state.window;
      fillInputs(w[0], w[1]);
      message("Tip: you can drag across the chart to zoom.", false);
    }
  }
  function message(text, bad) {
    var m = el("sheet-msg");
    m.textContent = text;
    m.classList.toggle("bad", !!bad);
  }

  el("range-btn").addEventListener("click", function () { setSheet(!sheetOpen); });
  el("range-reset").addEventListener("click", function () {
    post({ type: "range", value: lastPreset });
  });
  el("apply").addEventListener("click", function () {
    var from = epochOf("from-date", "from-time");
    var to = epochOf("to-date", "to-time");
    if (!from || !to) { message("Pick a start and an end date.", true); return; }
    if (to <= from) { message("The end has to be after the start.", true); return; }
    message("Applying\u2026", false);
    post({ type: "custom", from: from, to: to });
  });

  document.addEventListener("mousedown", function (ev) {
    if (!sheetOpen) { return; }
    if (el("sheet").contains(ev.target) || el("range-btn").contains(ev.target)) { return; }
    setSheet(false);
  });

  el("quit").addEventListener("click", function () { post({ type: "quit" }); });
  document.addEventListener("keydown", function (e) {
    if (e.key !== "Escape") { return; }
    if (sheetOpen) { setSheet(false); } else { post({ type: "hide" }); }
  });

  var modes = el("modes");
  modes.addEventListener("click", function (e) {
    var b = e.target.closest("button");
    if (!b) { return; }
    mode = b.dataset.mode;
    Array.prototype.forEach.call(modes.children, function (c) {
      c.classList.toggle("on", c === b);
    });
    if (state) { renderRows(state); }
  });

  /* ---------- chart ---------- */
  function renderChart(s) {
    var svg = el("graph"), tip = el("tip"), empty = el("empty"), peak = el("peak");
    var pts = s.series || [];
    if (pts.length < 2) {
      svg.innerHTML = "";
      empty.style.display = "flex";
      peak.textContent = "";
      return;
    }
    empty.style.display = "none";

    var max = 1;
    for (var i = 0; i < pts.length; i++) { max = Math.max(max, pts[i].rx, pts[i].tx); }
    var top = max * 1.15;
    peak.textContent = "peak " + rateShort(max) + "/s";

    var px = function (i) { return (i / (pts.length - 1)) * W; };
    var py = function (v) { return H - PADB - (v / top) * (H - PADT - PADB); };

    var rxLine = "", txLine = "", area = "M 0 " + H;
    for (var j = 0; j < pts.length; j++) {
      var x = px(j).toFixed(1);
      rxLine += (j ? " L " : "M ") + x + " " + py(pts[j].rx).toFixed(1);
      txLine += (j ? " L " : "M ") + x + " " + py(pts[j].tx).toFixed(1);
      area += " L " + x + " " + py(pts[j].rx).toFixed(1);
    }
    area += " L " + W + " " + H + " Z";

    var grid = "";
    for (var g = 1; g <= 3; g++) {
      var gy = (PADT + (H - PADT - PADB) * (g / 4)).toFixed(1);
      grid += '<line x1="0" y1="' + gy + '" x2="' + W + '" y2="' + gy +
              '" stroke="rgba(255,255,255,0.05)" stroke-width="1" vector-effect="non-scaling-stroke"/>';
    }

    svg.innerHTML =
      '<defs><linearGradient id="rxg" x1="0" y1="0" x2="0" y2="1">' +
      '<stop offset="0%" stop-color="' + s.colors.rx + '" stop-opacity="0.42"/>' +
      '<stop offset="100%" stop-color="' + s.colors.rx + '" stop-opacity="0.02"/></linearGradient></defs>' +
      grid +
      '<path d="' + area + '" fill="url(#rxg)" stroke="none"/>' +
      '<path d="' + rxLine + '" fill="none" stroke="' + s.colors.rx +
      '" stroke-width="1.6" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>' +
      '<path d="' + txLine + '" fill="none" stroke="' + s.colors.tx +
      '" stroke-width="1.2" stroke-dasharray="3 2.5" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>';

    var span = (s.window[1] - s.window[0]) || 1;
    el("x-from").textContent = axisLabel(s.window[0], span);
    el("x-to").textContent = axisLabel(s.window[1], span);

    var host = el("chart");
    host.addEventListener("mousemove", function (ev) {
      if (dragging || sheetOpen) { return; }
      var box = svg.getBoundingClientRect();
      var rel = (ev.clientX - box.left) / box.width;
      if (rel < 0 || rel > 1) { tip.style.display = "none"; return; }
      var idx = Math.max(0, Math.min(pts.length - 1, Math.round(rel * (pts.length - 1))));
      var p = pts[idx];
      tip.innerHTML = stamp(p.t) + "<br>&#8595; <b>" + rateShort(p.rx) + "B/s</b>" +
                      "<br>&#8593; <b>" + rateShort(p.tx) + "B/s</b>";
      tip.style.display = "block";
      var tw = tip.offsetWidth;
      tip.style.left = Math.max(0, Math.min(box.width - tw, ev.clientX - box.left - tw / 2)) + "px";
      tip.style.top = "0px";
    });
    host.addEventListener("mouseleave", function () {
      if (!dragging) { tip.style.display = "none"; }
    });
  }

  /* ---------- drag across the chart to pick any window ---------- */
  var dragging = false, dragFrom = 0;
  var chart = el("chart"), sel = el("sel");

  chart.addEventListener("mousedown", function (ev) {
    if (sheetOpen || !state || !state.series || state.series.length < 2) { return; }
    dragging = true;
    dragFrom = ev.clientX;
    el("tip").style.display = "none";
    var box = chart.getBoundingClientRect();
    sel.style.left = (dragFrom - box.left) + "px";
    sel.style.width = "0px";
    sel.style.display = "block";
  });

  document.addEventListener("mousemove", function (ev) {
    if (!dragging) { return; }
    var box = chart.getBoundingClientRect();
    var a = Math.max(0, Math.min(box.width, dragFrom - box.left));
    var b = Math.max(0, Math.min(box.width, ev.clientX - box.left));
    sel.style.left = Math.min(a, b) + "px";
    sel.style.width = Math.abs(b - a) + "px";
  });

  document.addEventListener("mouseup", function (ev) {
    if (!dragging) { return; }
    dragging = false;
    sel.style.display = "none";
    var box = chart.getBoundingClientRect();
    var a = Math.max(0, Math.min(box.width, dragFrom - box.left)) / box.width;
    var b = Math.max(0, Math.min(box.width, ev.clientX - box.left)) / box.width;
    var lo = Math.min(a, b), hi = Math.max(a, b);
    if (hi - lo < 0.04) { return; }
    var span = state.window[1] - state.window[0];
    var from = Math.floor(state.window[0] + span * lo);
    var to = Math.ceil(state.window[0] + span * hi);
    if (to - from < 60) { return; }
    post({ type: "custom", from: from, to: to });
  });

  /* ---------- rows ---------- */
  function row(name, rate, total) {
    var d = document.createElement("div");
    d.className = "row";
    var n = document.createElement("span"); n.className = "name"; n.textContent = name;
    var r = document.createElement("span"); r.className = "rate"; r.textContent = rate || "";
    var t = document.createElement("span"); t.className = "total"; t.textContent = total;
    d.appendChild(n); d.appendChild(r); d.appendChild(t);
    return d;
  }
  function blank(text) {
    var d = document.createElement("div");
    d.className = "none";
    d.textContent = text;
    return d;
  }

  function renderRows(s) {
    var host = el("rows"), hint = el("hint");
    host.innerHTML = "";
    if (mode === "apps") {
      hint.textContent = "since launch";
      if (!s.appsSupported) {
        host.appendChild(blank("Per-app usage needs macOS nettop." +
          (s.appsError ? " (" + s.appsError + ")" : "")));
        return;
      }
      if (!s.apps.length) {
        host.appendChild(blank("No app traffic seen yet."));
        return;
      }
      s.apps.forEach(function (a) {
        var live = a.rateRx + a.rateTx > 0
          ? "\u2193" + rateShort(a.rateRx) + " \u2191" + rateShort(a.rateTx) : "";
        host.appendChild(row(a.name, live, bytes(a.total)));
      });
      return;
    }
    hint.textContent = describe(s);
    if (!s.interfaces.length) {
      host.appendChild(blank("No traffic recorded for this window."));
      return;
    }
    s.interfaces.forEach(function (i) {
      var live = i.rateRx + i.rateTx > 0
        ? "\u2193" + rateShort(i.rateRx) + " \u2191" + rateShort(i.rateTx) : "";
      host.appendChild(row(i.name, live, bytes(i.total)));
    });
  }

  /* ---------- main render ---------- */
  function render(s) {
    state = s;

    var rx = rateParts(s.rate.rx), tx = rateParts(s.rate.tx);
    el("rate-rx").textContent = rx[0];
    el("unit-rx").textContent = rx[1];
    el("rate-tx").textContent = tx[0];
    el("unit-tx").textContent = tx[1];

    el("range-label").textContent = describe(s);
    el("range-total").textContent = bytes(s.totals.total);
    el("range-reset").classList.toggle("show", s.range === "custom");
    if (s.range !== "custom") { lastPreset = s.range; }

    Array.prototype.forEach.call(chips.children, function (c) {
      c.classList.toggle("on", c.dataset.key === s.range);
    });
    if (sheetOpen) {
      var focused = document.activeElement;
      if (!(focused && focused.tagName === "INPUT")) {
        var w = s.custom || s.window;
        fillInputs(w[0], w[1]);
      }
      if (s.range === "custom") { message("Showing " + describe(s), false); }
    }

    renderChart(s);

    el("today").textContent = bytes(s.today.total);
    el("cycle").textContent = bytes(s.cycle.total);
    el("cycle-label").textContent = s.plan.cycle === "weekly" ? "This week" : "This month";

    var cap = el("cap");
    if (s.plan.enabled && s.plan.cap > 0) {
      cap.style.display = "flex";
      cap.classList.toggle("warn", s.plan.percent >= 80 && s.plan.percent < 100);
      cap.classList.toggle("over", s.plan.percent >= 100);
      el("cap-used").textContent = bytes(s.plan.used) + " of " + bytes(s.plan.cap);
      el("cap-pct").textContent = s.plan.percent.toFixed(0) + "%";
      el("cap-fill").style.width = Math.min(100, s.plan.percent) + "%";
      el("cap-foot").textContent = "Resets on the " + ordinal(s.plan.resetDay);
    } else {
      cap.style.display = "none";
    }

    renderRows(s);

    if (s.range === "custom" && s.custom) {
      el("note").textContent = stamp(s.custom[0]) + " \u2192 " + stamp(s.custom[1]);
    } else {
      el("note").textContent = "Drag the chart to zoom";
    }
    document.title = "NetMeter " + s.rangeLabel;
  }

  window.netmeter = { update: render };
  post({ type: "ready" });
  if (window.__netmeterRevealSheet) { setSheet(true); }
})();
</script>
</body>
</html>
